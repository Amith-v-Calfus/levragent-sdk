[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "levragent"
version = "0.1.0"
description = "SDK for building and publishing agents to the Levragent marketplace"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/levragent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
